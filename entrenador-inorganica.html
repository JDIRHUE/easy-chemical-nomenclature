<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profe Juanjo Virtual · Entrenador de formulación inorgánica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F6FB; --surface:#FFFFFF; --surface2:#EAF0F8; --ink:#10233A; --ink2:#465A72; --line:#D0DAE7;
  --brand:#2A3FB8; --brandInk:#FFFFFF;
  --ok:#0B6B41; --okBg:#E0F4E9; --warn:#87500A; --warnBg:#FFF0D2; --bad:#A8231B; --badBg:#FCE6E3;
  --fgL:33%; --bgL:94%; --sat:62%;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --text:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1521; --surface:#152135; --surface2:#1B2A42; --ink:#E7EEF8; --ink2:#A2B3C9; --line:#2A3B55;
    --brand:#8EA2FF; --brandInk:#0D1521;
    --ok:#6FE0A6; --okBg:#123626; --warn:#F4C66B; --warnBg:#3A2A0E; --bad:#FF9C93; --badBg:#43201D;
    --fgL:72%; --bgL:19%; --sat:48%;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1521; --surface:#152135; --surface2:#1B2A42; --ink:#E7EEF8; --ink2:#A2B3C9; --line:#2A3B55;
  --brand:#8EA2FF; --brandInk:#0D1521;
  --ok:#6FE0A6; --okBg:#123626; --warn:#F4C66B; --warnBg:#3A2A0E; --bad:#FF9C93; --badBg:#43201D;
  --fgL:72%; --bgL:19%; --sat:48%;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:920px;margin:0 auto;padding:20px 18px 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
sub{font-size:.68em;line-height:0;vertical-align:baseline;position:relative;top:.3em}
sup{font-size:.68em;line-height:0;vertical-align:baseline;position:relative;top:-.45em}

.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px;color:var(--ink2)}
.brand b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--brandInk);font-size:16px}
h1{font-family:var(--display);font-weight:750;font-size:clamp(30px,5.4vw,46px);line-height:1.04;letter-spacing:-.025em;margin:22px 0 10px;max-width:16em}
.lead{max-width:58ch;color:var(--ink2);margin:0 0 18px}
details.norma{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 16px;margin:0 0 26px;max-width:720px}
details.norma summary{cursor:pointer;padding:12px 0;font-weight:700}
details.norma ul{margin:0 0 14px;padding-left:20px;color:var(--ink2)}
details.norma li{margin:5px 0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;list-style:none;margin:0;padding:0}
.tile{--mc:hsl(var(--mh) var(--sat) var(--fgL));--mbg:hsl(var(--mh) var(--sat) var(--bgL));
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-top:7px solid var(--mc);border-radius:12px;padding:14px 16px 14px;min-height:150px}
.tile:hover{background:var(--mbg)}
.tile .sym{font-family:var(--display);font-weight:750;font-size:34px;line-height:1.1;letter-spacing:-.02em;color:var(--mc);min-height:40px}
.tile .nm{font-weight:700;font-size:17px;line-height:1.25}
.tile .meta{margin-top:auto;font-size:14px;color:var(--ink2)}
.tile.exam{border-style:dashed;border-top-style:solid}
.tile.neutral{--sat:10%}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:700}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brandInk)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.link{border:0;background:none;padding:9px 4px;text-decoration:underline;color:var(--ink2);font-weight:400}
.count{color:var(--ink2);font-size:15px}
.modhead{--mc:hsl(var(--mh) var(--sat) var(--fgL));--mbg:hsl(var(--mh) var(--sat) var(--bgL));margin-top:14px}
.modhead h2{font-family:var(--display);font-weight:750;font-size:clamp(26px,4.6vw,36px);line-height:1.08;letter-spacing:-.02em;margin:6px 0 12px;color:var(--mc)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.pill{width:22px;height:8px;border-radius:99px;background:var(--line)}
.pill.cur{background:var(--ink2)}
.pill.first{background:var(--ok)}
.pill.help{background:var(--warn)}
.pill.fail{background:var(--bad)}
details.regla{background:var(--mbg);border-radius:12px;padding:0 16px;margin:0 0 16px}
details.regla summary{cursor:pointer;padding:11px 0;font-weight:700}
details.regla ul{margin:0 0 12px;padding-left:20px}
details.regla li{margin:5px 0}
.plate{--mc:hsl(var(--mh) var(--sat) var(--fgL));background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--mc);border-radius:12px;padding:18px 20px 16px;margin:0 0 14px}
.plate .lab{color:var(--ink2);font-size:15px;margin:0 0 4px}
.plate .big{font-family:var(--display);font-weight:750;line-height:1.05;letter-spacing:-.02em;overflow-wrap:anywhere}
.plate .big.formula{font-size:clamp(44px,11vw,72px)}
.plate .big.words{font-size:clamp(28px,6.4vw,42px)}
.plate .big.ask{font-size:clamp(22px,4.6vw,30px);font-weight:650;line-height:1.2}
.chip{display:inline-block;margin-top:12px;background:var(--surface2);border-radius:99px;padding:3px 12px;font-size:14px;color:var(--ink2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.row input{flex:1 1 240px;min-width:0;font:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.row input:focus-visible{border-color:var(--brand);outline-offset:1px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0;align-items:center}
.ins{min-width:38px;padding:6px 10px;font-size:18px}
.fb{margin:16px 0 0;border-radius:12px;padding:14px 16px;border-left:8px solid var(--line);background:var(--surface2)}
.fb[hidden]{display:none}
.fb.ok{background:var(--okBg);border-color:var(--ok)}
.fb.warn{background:var(--warnBg);border-color:var(--warn)}
.fb.bad{background:var(--badBg);border-color:var(--bad)}
.fb .t{font-family:var(--display);font-weight:700;font-size:20px;margin:0 0 4px}
.fb.ok .t{color:var(--ok)} .fb.warn .t{color:var(--warn)} .fb.bad .t{color:var(--bad)}
.fb p{margin:6px 0}
.fb .sol{font-family:var(--display);font-weight:700;font-size:24px}
.fb .go{margin-top:10px}
@media (prefers-reduced-motion:no-preference){ .fb:not([hidden]){animation:pop .16s ease-out} }
@keyframes pop{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}

.score{font-family:var(--display);font-weight:750;font-size:clamp(34px,7vw,54px);line-height:1.05;letter-spacing:-.02em;margin:14px 0 4px}
.rev{list-style:none;margin:16px 0;padding:0;display:grid;gap:8px}
.rev li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:28px 1fr;gap:10px}
.rev .g{font-weight:800;font-size:20px}
.rev .g.first{color:var(--ok)} .rev .g.help{color:var(--warn)} .rev .g.fail{color:var(--bad)}
.rev .q{font-weight:700}
.rev .a{color:var(--ink2);font-size:15px;margin-top:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
footer{margin-top:36px;color:var(--ink2);font-size:14px;max-width:70ch}
.wide{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap" id="app"><noscript>Esta página necesita JavaScript para funcionar.</noscript></div>
<script>
/* ============ DATOS ============ */
const N=(q,a,h,e)=>({k:'N',q,a,h,e}), F=(q,a,h,e)=>({k:'F',q,a,h,e}), C=(q,a,h,e)=>({k:'C',q,a,h,e});
const Q=(q,a,show,h,e)=>({k:'Q',q,a,show,h,e}), T=(q,a,show,h,e)=>({k:'T',q,a,show,h,e});
const NB='Vale Stock (números romanos) o prefijos multiplicadores';
const MODS=[
{n:'Números de oxidación',sym:'+ / −',mh:215,neutral:true,norma:'Responde con los números, por ejemplo +2 y +3',
 rule:['Grupo 1 (Li, Na, K, Rb, Cs): +1. Grupo 2 (Be, Mg, Ca, Sr, Ba): +2.',
 'Grupo 13: boro, aluminio, galio e indio: +3. El talio es la excepción del grupo: +1 y +3.',
 'Grupo 14: carbono +2 y +4; silicio solo +4; germanio, estaño y plomo: +2 y +4.',
 'Grupo 15: nitrógeno, fósforo, arsénico y antimonio actúan con −3 como no metales; en positivo, nitrógeno de +1 a +5, fósforo/arsénico/antimonio con +1(solo P), +3 y +5, y bismuto solo +3 y +5.',
 'Grupo 16: oxígeno −2 (−1 en los peróxidos); azufre, selenio y teluro: −2, +2, +4 y +6.',
 'Grupo 17: el flúor solo actúa con −1; cloro, bromo y yodo: −1, +1, +3, +5 y +7.',
 'El hidrógeno es +1, salvo en los hidruros metálicos, donde es −1.',
 'Metales de transición con varios números: titanio +2, +3 y +4; vanadio de +2 a +5; cromo +2, +3 y +6; manganeso +2, +3, +4, +6 y +7; hierro, cobalto y níquel: +2 y +3; cobre +1 y +2; oro +1 y +3; mercurio +1 y +2; platino y paladio +2 y +4.',
 'Metales de transición con un único número: cinc y cadmio +2; plata +1.'],
 items:[
 Q('¿Con qué números de oxidación positivos actúa el hierro?',[2,3],'+2 y +3','El hierro es un metal de transición: tiene más de un número. Piensa en Fe(II) y Fe(III).','Hierro: +2 y +3. Por eso hay que indicarlo: óxido de hierro(II) y óxido de hierro(III).'),
 Q('¿Cuál es el único número de oxidación del aluminio?',[3],'+3','Está en el grupo 13 (boroideos).','Los elementos del grupo 13 solo actúan con +3, así que no lleva número romano: óxido de aluminio.'),
 Q('¿Con qué números de oxidación forman ácidos el cloro, el bromo y el yodo?',[1,3,5,7],'+1, +3, +5 y +7','Los halógenos (salvo el flúor) usan los números impares positivos.','Cl, Br, I: +1, +3, +5, +7. Dan los ácidos hipo-oso, -oso, -ico y per-ico.'),
 Q('¿Con qué número de oxidación actúa el hidrógeno en el NaH?',[-1],'−1','En los hidruros metálicos el hidrógeno gana un electrón. Fíjate en el signo.','En los hidruros metálicos el H es −1 (el metal aporta el +).'),
 Q('¿Con qué números de oxidación actúan el platino y el paladio?',[2,4],'+2 y +4','Los dos están en la misma zona y solo tienen dos números.','Pd y Pt: solo +2 y +4.'),
 Q('¿Con qué números de oxidación positivos actúa el nitrógeno?',[1,2,3,4,5],'de +1 a +5','El nitrógeno tiene muchos: prueba con todos los valores entre el más bajo y el más alto.','N: de +1 a +5. Forman ácidos los impares (+1, +3, +5): HNO, HNO2, HNO3.'),
 Q('¿Con qué números de oxidación positivos actúa el azufre?',[2,4,6],'+2, +4 y +6','Los anfígenos (grupo 16) usan números pares.','S, Se y Te: +2, +4 y +6 (y −2 en sales y haluros).')]},

{n:'Óxidos',sym:'O<sup>2−</sup>',mh:2,norma:NB,
 rule:['Fórmula: MxOy. Los números de oxidación del metal (+m) y del oxígeno (−2) se cruzan y se simplifican si se puede.','Stock: «óxido de + metal»; si el metal tiene varios números de oxidación, número romano entre paréntesis: óxido de hierro(III).','Prefijos: trióxido de dihierro. El prefijo mono nunca va delante del último elemento nombrado.','Los óxidos de no metales se nombran igual: SO3, óxido de azufre(VI) o trióxido de azufre.'],
 items:[
 N('Li2O',['óxido de litio','óxido de dilitio','monóxido de dilitio'],'El litio es del grupo 1: ¿tiene uno o varios números de oxidación? Si solo tiene uno, no hace falta indicarlo.','Li (+1) y O (−2) dan Li2O. Como el litio solo tiene +1, en Stock basta «óxido de litio»; con prefijos, «óxido de dilitio».'),
 N('Fe2O3',['óxido de hierro(III)','trióxido de dihierro'],'Hay dos hierros y tres oxígenos. ¿Qué número de oxidación del hierro sale de cruzar el 2 y el 3?','Al cruzar, el 3 (subíndice del O) es el número de oxidación del Fe. Stock: óxido de hierro(III). Prefijos: trióxido de dihierro.'),
 N('SO3',['óxido de azufre(VI)','trióxido de azufre'],'Tres oxígenos con −2 suman −6. ¿Qué número de oxidación necesita el azufre?','3 × (−2) = −6, luego el azufre es +6: óxido de azufre(VI) o trióxido de azufre.'),
 N('CuO',['óxido de cobre(II)','óxido de cobre','monóxido de cobre'],'Un cobre y un oxígeno (−2): ¿qué número de oxidación tiene el cobre?','Cu (+2) y O (−2) se compensan: óxido de cobre(II). Con prefijos, «óxido de cobre» o «monóxido de cobre».'),
 F('óxido de cinc',['ZnO'],'El cinc solo actúa con +2 y el oxígeno con −2. ¿Qué subíndices salen al cruzar y simplificar?','Zn (+2) y O (−2): al cruzar sale Zn2O2, que se simplifica a ZnO.'),
 F('óxido de níquel(III)',['Ni2O3'],'Cruza los números: el 3 del níquel pasa al oxígeno y el 2 del oxígeno pasa al níquel.','Ni (+3) y O (−2) dan Ni2O3.'),
 F('pentaóxido de difósforo',['P2O5'],'Los prefijos indican directamente los subíndices: di- es 2 y penta- es 5.','Difósforo es P2 y pentaóxido es O5: P2O5.'),
 F('óxido de manganeso(VII)',['Mn2O7'],'El 7 del manganeso pasa al oxígeno y el 2 del oxígeno pasa al manganeso.','Mn (+7) y O (−2) dan Mn2O7. No se puede simplificar.')]},

{n:'Peróxidos',sym:'O<sub>2</sub><sup>2−</sup>',mh:24,norma:NB,
 rule:['Contienen el grupo peroxo O2 (cada oxígeno con número de oxidación −1).','Metales con +1 (y el H): M2O2, sin simplificar (Na2O2, H2O2). Metales con +2: MO2 (BaO2).','Solo forman peróxidos los metales que actúan únicamente con +1, con +2 o con ambos. Hierro, níquel u oro no forman peróxidos.','Stock: peróxido de sodio. Prefijos: dióxido de disodio.'],
 items:[
 N('Na2O2',['peróxido de sodio','dióxido de disodio'],'El grupo O2 tiene carga −2 en conjunto. ¿Es un óxido normal o un peróxido?','Na2O2 lleva el grupo peroxo O2. Stock: peróxido de sodio. Prefijos: dióxido de disodio.'),
 N('BaO2',['peróxido de bario','dióxido de bario'],'Un bario (+2) y un grupo O2 (−2): se compensan sin subíndices.','BaO2: peróxido de bario o dióxido de bario.'),
 N('H2O2',['peróxido de hidrógeno','dióxido de dihidrógeno'],'Es el agua oxigenada. ¿Cómo se nombra el grupo O2?','H2O2: peróxido de hidrógeno o dióxido de dihidrógeno.'),
 F('peróxido de litio',['Li2O2'],'Litio +1 y grupo O2 (−2). Recuerda que el O2 no se simplifica.','Dos Li (+1) compensan al grupo O2 (−2): Li2O2.'),
 F('peróxido de estroncio',['SrO2'],'El estroncio (grupo 2) es +2 y el grupo O2 es −2: se compensan.','Sr (+2) y O2 (−2): SrO2.'),
 F('dióxido de dicesio',['Cs2O2'],'Los prefijos dan los subíndices: di- = 2 cesios; dióxido = O2.','Dicesio es Cs2 y dióxido es O2: Cs2O2.'),
 T('¿Existe el peróxido de hierro?','no','No','Piensa en los números de oxidación del hierro: ¿cumplen la condición de ser solo +1 y/o +2?','No: solo forman peróxidos los metales que actúan únicamente con +1, con +2 o con ambos. El hierro tiene +2 y +3.')]},

{n:'Hidróxidos',sym:'OH<sup>−</sup>',mh:44,norma:NB,
 rule:['Fórmula: M(OH)m. El grupo OH vale −1, así que el número de oxidación del metal indica cuántos OH hay.','Con más de un OH se escribe entre paréntesis: Ca(OH)2. Con uno, sin paréntesis: NaOH.','Stock: hidróxido de hierro(III). Prefijos: trihidróxido de hierro.'],
 items:[
 N('Ca(OH)2',['hidróxido de calcio','dihidróxido de calcio'],'El grupo OH vale −1 y el calcio +2. ¿Cuántos OH hay? ¿Tiene el calcio más de un número de oxidación?','Ca (+2) con dos OH: hidróxido de calcio. Con prefijos: dihidróxido de calcio.'),
 N('Fe(OH)3',['hidróxido de hierro(III)','trihidróxido de hierro'],'Hay tres OH (−1 cada uno). ¿Qué número de oxidación necesita el hierro?','Tres OH suman −3, luego Fe (+3): hidróxido de hierro(III) o trihidróxido de hierro.'),
 N('CuOH',['hidróxido de cobre(I)','hidróxido de cobre','monohidróxido de cobre'],'Hay un solo OH. ¿Qué número de oxidación tiene el cobre aquí?','Un OH (−1) implica Cu (+1): hidróxido de cobre(I).'),
 N('Pb(OH)4',['hidróxido de plomo(IV)','tetrahidróxido de plomo'],'Cuatro OH suman −4. ¿Qué número de oxidación tiene el plomo?','Cuatro OH → Pb (+4): hidróxido de plomo(IV) o tetrahidróxido de plomo.'),
 F('hidróxido de potasio',['KOH'],'El potasio es +1 y el OH es −1: ¿cuántos OH?','K (+1) con un OH: KOH, sin paréntesis.'),
 F('hidróxido de cromo(III)',['Cr(OH)3'],'El número de oxidación del cromo es el número de OH. ¿Paréntesis?','Cr (+3) necesita tres OH: Cr(OH)3.'),
 F('dihidróxido de bario',['Ba(OH)2'],'Di- indica dos grupos OH.','Dos OH con paréntesis: Ba(OH)2.'),
 F('hidróxido de oro(III)',['Au(OH)3'],'El número romano dice cuántos OH hay.','Au (+3) → tres OH: Au(OH)3.')]},

{n:'Hidruros metálicos',sym:'H<sup>−</sup>',mh:84,norma:NB,
 rule:['Fórmula: MHm. El hidrógeno vale −1 y se escribe a la derecha.','Se nombran como los óxidos, cambiando «óxido» por «hidruro».','Stock: hidruro de hierro(II). Prefijos: dihidruro de hierro.'],
 items:[
 N('NaH',['hidruro de sodio'],'El hidrógeno aquí es H−: se nombra «hidruro». ¿Tiene el sodio varios números de oxidación?','Na (+1) y H (−1): NaH. El sodio solo tiene +1, así que «hidruro de sodio».'),
 N('AlH3',['hidruro de aluminio','trihidruro de aluminio'],'Tres H (−1) suman −3. ¿Cuántos números de oxidación tiene el aluminio?','Al (+3) con tres H. Stock: hidruro de aluminio. Prefijos: trihidruro de aluminio.'),
 N('SnH4',['hidruro de estaño(IV)','tetrahidruro de estaño'],'Cuatro H (−1) suman −4: ¿qué número tiene el estaño?','Sn (+4): hidruro de estaño(IV) o tetrahidruro de estaño.'),
 F('hidruro de calcio',['CaH2'],'El calcio es +2 y el H es −1. ¿Cuántos H?','Ca (+2) con dos H: CaH2.'),
 F('hidruro de hierro(II)',['FeH2'],'El número romano es el número de H (el 1 no se escribe).','Fe (+2) con dos H: FeH2.'),
 F('trihidruro de cromo',['CrH3'],'Tri- indica tres hidrógenos.','Un cromo y tres H: CrH3.')]},

{n:'Hidruros no metálicos y haluros de hidrógeno',sym:'HCl',mh:140,norma:NB,
 rule:['Grupos 13-15 (B, C, Si, N, P, As, Sb): XHn, con H a la derecha y nombres propios: NH3 amoniaco, PH3 fosfano, AsH3 arsano, SbH3 estibano, CH4 metano, SiH4 silano, BH3 borano (o con prefijos: trihidruro de nitrógeno…).','Grupos 16 y 17 (F, Cl, Br, I, S, Se, Te): HnX, con H a la izquierda. Nombre: «cloruro de hidrógeno», «sulfuro de hidrógeno».','«Ácido clorhídrico», «ácido sulfhídrico»… solo si está en disolución acuosa.'],
 items:[
 N('NH3',['amoniaco','trihidruro de nitrógeno'],'Es un hidruro de un no metal del grupo 15 con un nombre propio muy conocido.','NH3: amoniaco o trihidruro de nitrógeno.'),
 N('PH3',['fosfano','trihidruro de fósforo'],'Es el análogo del amoniaco con fósforo. Ya no se usa el nombre «fosfina».','PH3: fosfano o trihidruro de fósforo.'),
 N('CH4',['metano','tetrahidruro de carbono'],'Es el hidrocarburo más sencillo.','CH4: metano o tetrahidruro de carbono.'),

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=s=>esc(s).replace(/([A-Za-z\)])(\d+)/g,'$1<sub>$2</sub>');
const strip=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function normName(s){
  s=strip(String(s)).toLowerCase().replace(/[\u2212\u2013\u2014]/g,'-').replace(/\s+/g,' ').trim();
  s=s.replace(/\s*\(\s*/g,'(').replace(/\s*\)\s*/g,')').replace(/\s+(iv|ix|v?i{1,3}|v|x)$/,'($1)');
  return s.replace(/zinc/g,'cinc').replace(/seleniuro/g,'selenuro').replace(/[.,;:!]+$/,'');
}
const normF=s=>String(s).replace(/[\u2080-\u2089]/g,c=>String(c.charCodeAt(0)-0x2080)).replace(/\s+/g,'').replace(/[\[\{]/g,'(').replace(/[\]\}]/g,')');
const elems=s=>[...new Set(s.match(/[A-Z][a-z]?/g)||[])].sort().join(',');
const noRoman=s=>s.replace(/\([ivx]+\)/g,'');
function parseNums(s){
  s=String(s).replace(/[\u2212\u2013]/g,'-');const set=new Set();
  s=s.replace(/(\d+)\s*(?:a|hasta)\s*\+?(\d+)/gi,(m,a,b)=>{for(let i=+a;i<=+b;i++)set.add(i);return ' ';});
  (s.match(/[-+]?\d+/g)||[]).forEach(t=>set.add(parseInt(t,10)));
  return set;
}
const OLD=/\b(ferric|ferros|cupric|cupros|potasic|sodic|calcic|magnesic|aluminic|plumbic|plumbos|argentic|mercuric|mercurios|estannic|estannos|baric|cinquic|litic|amonic|niquelic|cobaltic)[oa]\b/;
const BIC=/\b(bicarbonato|bisulfato|bisulfito|bifosfato|bisulfuro)\b/;
const OLDH=/\b(fosfina|arsina|estibina)\b/;
const solText=it=>it.k==='Q'||it.k==='T'?it.show:it.a[0];

function check(it,raw){
  const s=String(raw).trim();
  if(!s) return {ok:false,msg:'Escribe una respuesta antes de comprobar.',empty:true};
  if(it.k==='Q'){
    const got=parseNums(s),exp=new Set(it.a);
    if(got.size===0) return {ok:false,msg:'Responde con números, por ejemplo +2 y +3.'};
    const same=got.size===exp.size&&[...got].every(x=>exp.has(x));
    if(same) return {ok:true};
    const absSame=[...got].map(Math.abs).sort().join()===[...exp].map(Math.abs).sort().join();
    if(absSame) return {ok:false,msg:'Los valores están bien, pero fíjate en el signo.'};
    if([...got].every(x=>exp.has(x))) return {ok:false,msg:'Vas bien, pero te falta alguno.'};
    if([...exp].every(x=>got.has(x))) return {ok:false,msg:'Están todos los que son, pero sobra alguno.'};
    return {ok:false,msg:'No coincide todavía.'};
  }
  if(it.k==='T'){
    const n=strip(s).toLowerCase();
    const yes=/^(si|s)\b/.test(n),no=/^no\b/.test(n);
    if(!yes&&!no) return {ok:false,msg:'Responde sí o no.'};
    return {ok:(it.a==='no')===no};
  }
  if(it.k==='F'){
    const acc=it.a.map(normF),got=normF(s);
    if(acc.includes(got)) return {ok:true};
    if(/[a-z]{3,}\s+de\s+/i.test(s)||/\s/.test(s)&&/[a-z]{4,}/.test(s.replace(/[A-Z][a-z]?/g,''))) return {ok:false,msg:'Aquí hay que escribir una fórmula, no un nombre.'};
    if(acc.some(a=>a.toLowerCase()===got.toLowerCase())) return {ok:false,msg:'Casi: revisa las mayúsculas y minúsculas de los símbolos (por ejemplo, Co no es lo mismo que CO).'};
    if(acc.some(a=>elems(a)===elems(got))) return {ok:false,msg:'Los elementos son los correctos. Revisa los subíndices y los paréntesis.'};
    return {ok:false,msg:'Revisa qué elementos forman el compuesto y en qué orden se escriben.'};
  }
  const acc=it.a.map(normName),got=normName(s);
  if(acc.includes(got)) return {ok:true};
  const expAcid=it.a.some(a=>/^acido/.test(normName(a)));
  if(/^[A-Z][A-Za-z0-9()]*$/.test(s)&&!/\s/.test(s)) return {ok:false,msg:'Aquí hay que escribir el nombre, no la fórmula.'};
  if(OLD.test(got)&&!expAcid) return {ok:false,msg:'Ese nombre con terminación -ico/-oso aplicada al metal está anticuado y no se admite. Indica el número de oxidación con números romanos.'};
  if(BIC.test(got)) return {ok:false,msg:'«Bicarbonato», «bisulfato»… son nombres antiguos. Usa «hidrogeno…» (hidrogenocarbonato, hidrogenosulfato).'};
  if(OLDH.test(got)) return {ok:false,msg:'Ese nombre se ha abandonado. Usa fosfano, arsano, estibano o el nombre con prefijos (trihidruro de…).'};
  if(/^acido \w+hidrico/.test(got)&&!expAcid) return {ok:false,msg:'«Ácido …hídrico» es el nombre de la disolución acuosa. Para el gas se usa «… de hidrógeno».'};
  const nr=acc.map(noRoman);
  if(nr.includes(noRoman(got))){
    return {ok:false,msg:/\([ivx]+\)/.test(got)?'Ojo con el número de oxidación entre paréntesis: no es el correcto.':'Falta el número de oxidación en números romanos, porque este elemento tiene varios.'};
  }
  return {ok:false,msg:'Todavía no coincide con lo que buscamos.'};
}

function order(items){
  const A=items.filter(i=>i.k==='N'||i.k==='C'),B=items.filter(i=>i.k==='F'),O=items.filter(i=>!'NCF'.includes(i.k)),out=[];
  while(A.length||B.length){if(A.length)out.push(A.shift());if(B.length)out.push(B.shift());}
  return out.concat(O);
}
MODS.forEach((m,mi)=>{m.items.forEach((it,i)=>{it.id=mi+'-'+i;});});


function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(items,n){
  const idx=new Map(items.map((it,i)=>[it,i]));
  const A=shuf(items.filter(i=>i.k==='N'||i.k==='C')),B=shuf(items.filter(i=>i.k==='F')),O=shuf(items.filter(i=>!'NCF'.includes(i.k)));
  let pick=[];
  if(!A.length&&!B.length) pick=O.slice(0,n);
  else{
    pick=O.slice(0,1);
    const need=n-pick.length;let a=Math.ceil(need/2),b=need-a;
    if(A.length<a){b+=a-A.length;a=A.length;}
    if(B.length<b){a+=b-B.length;b=B.length;}
    pick=pick.concat(A.slice(0,a),B.slice(0,b));
  }
  pick.sort((x,y)=>idx.get(x)-idx.get(y));
  return order(pick);
}
function buildExam(){
  const pool=MODS.slice(1,10),out=[],used=new Set();
  pool.forEach((m,i)=>{
    const dir=i%2===0?(x=>x.k==='N'||x.k==='C'):(x=>x.k==='F');
    const c=m.items.filter(dir);out.push(c[Math.floor(Math.random()*c.length)]);
  });
  out.forEach(x=>used.add(x));
  const m=pool[Math.floor(Math.random()*pool.length)];
  const c=m.items.filter(x=>x.k==='F'&&!used.has(x));out.push(c[Math.floor(Math.random()*c.length)]);
  return shuf(out);
}

  <p class="lead">Elige un tema. Cada vez te propongo 10 ejercicios distintos de un banco amplio, de uno en uno: tú respondes y te corrijo al momento. Si fallas, primero te doy una pista y, si hace falta, te explico el método paso a paso.</p>
  <details class="norma"><summary>Qué nomenclatura acepto</summary>
   <ul>
    <li>Óxidos, peróxidos, hidróxidos, hidruros y sales binarias: Stock (óxido de hierro(III)) o prefijos multiplicadores (trióxido de dihierro).</li>
    <li>Oxoácidos: nomenclatura tradicional (ácido sulfúrico).</li>
    <li>Oxisales y sales ácidas: tradicional-Stock (sulfato de hierro(III), hidrogenocarbonato de sodio).</li>
    <li>Nombres anticuados como «sulfato férrico», «nitrato potásico» o «bicarbonato» no se admiten.</li>
    <li>Las fórmulas se escriben en texto normal: H2SO4, Fe2(SO4)3.</li>
   </ul></details>
  <ul class="grid">${tiles}</ul>
  <footer>Práctica basada en los criterios de la Ponencia de Química de Andalucía. Tu progreso se guarda solo en este navegador. <button class="btn link" data-act="reset">Borrar mi progreso</button></footer>`;
  window.scrollTo(0,0);
}

function start(mi,items,label){
  const m=MODS[mi];
  const base=items||(m.exam?buildExam():sample(m.items,10));
  S={view:'ex',mod:mi,queue:base.slice(),orig:base.slice(),i:0,att:0,hint:false,done:false,res:{},streak:0,again:{},answers:{},retry:label==='retry',noFb:!!m.exam&&label!=='retry'};
  exercise();
}
function pills(){
  return S.orig.map(it=>{
    const r=S.res[it.id];const cur=S.queue[S.i]&&S.queue[S.i].id===it.id&&!S.done;
    return `<span class="pill ${r||''} ${cur&&!r?'cur':''}"></span>`;
  }).join('');
}
function exercise(){
  const m=MODS[S.mod],it=S.queue[S.i];
  S.att=0;S.hint=false;S.done=false;
  const again=S.i>=S.orig.length;
  let plate;
  if(it.k==='N') plate=`<p class="lab">Nombra este compuesto</p><div class="big formula">${fm(it.q)}</div>`;
  else if(it.k==='F') plate=`<p class="lab">Escribe la fórmula de</p><div class="big words">${esc(it.q)}</div>`;
  else plate=`<p class="lab">${it.k==='Q'?'Números de oxidación':'Pregunta'}</p><div class="big ask">${fm(it.q)}</div>`;
  const ph=it.k==='F'?'Fórmula, por ejemplo Fe2O3':it.k==='Q'?'Por ejemplo +2 y +3':it.k==='T'?'Sí o no':'Nombre del compuesto';
  const rules=m.rule.map(r=>`<li>${fm(r)}</li>`).join('');
  $('#app').innerHTML=`
  <div class="topbar"><button class="btn" data-act="home">← Temas</button>
   <span class="count">${again?'Repaso de un fallo':`Ejercicio ${S.i+1} de ${S.orig.length}`}${S.streak>=2?` · racha de ${S.streak}`:''}</span></div>
  <div class="modhead" style="--mh:${m.mh}"><h2>${esc(m.n)}</h2></div>
  <div class="pills" aria-hidden="true" style="--mh:${m.mh}">${pills()}</div>
  <details class="regla" style="--mh:${m.mh}"><summary>Regla clave</summary><ul>${rules}</ul></details>
  <div class="plate" style="--mh:${m.mh}">${plate}<span class="chip">${esc(m.norma)}</span>${S.noFb?'<span class="chip" style="margin-left:6px">Sin pistas hasta el final</span>':''}</div>
  <div class="row"><label for="ans" style="position:absolute;left:-9999px">Tu respuesta</label>
   <input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(ph)}">
   <button class="btn primary" id="bcheck" data-act="check">Comprobar</button></div>
  <div class="tools">
   <button class="btn ins" data-act="ins" data-c="(" aria-label="Insertar paréntesis de apertura">(</button>
   <button class="btn ins" data-act="ins" data-c=")" aria-label="Insertar paréntesis de cierre">)</button>
   ${S.noFb?'':'<button class="btn" id="bhint" data-act="hint">Pista</button><button class="btn" id="bsol" data-act="sol">Mostrar solución</button>'}
  </div>
  <div class="fb" id="fb" role="status" aria-live="polite" hidden></div>`;
  window.scrollTo(0,0);
  setTimeout(()=>{const a=$('#ans');if(a)a.focus({preventScroll:true});},0);
}
function fb(cls,title,html,nextBtn){
  const el=$('#fb');el.className='fb '+cls;el.hidden=false;
  el.innerHTML=`<p class="t">${title}</p>${html}${nextBtn?`<div class="go"><button class="btn primary" id="bnext" data-act="next">${nextBtn}</button></div>`:''}`;
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const OKS=['¡Correcto!','¡Muy bien!','¡Eso es!','¡Exacto!','¡Bien resuelto!'];

function lock(){
  const a=$('#ans');if(a)a.disabled=true;
  ['bcheck','bhint','bsol'].forEach(id=>{const b=$('#'+id);if(b)b.hidden=true;});
  document.querySelectorAll('.ins').forEach(b=>b.hidden=true);
}
function finishItem(status){
  const it=S.queue[S.i];
  if(S.i<S.orig.length) S.res[it.id]=status;
  else S.again[it.id]=status;
  const pl=document.querySelector('.pills');if(pl)pl.innerHTML=pills();
}
function submit(){
  if(S.done)return;
  const it=S.queue[S.i],m=MODS[S.mod],inp=$('#ans'),v=inp.value;
  const r=check(it,v);
  if(r.empty){fb('warn','Escribe algo primero','<p>Escribe tu respuesta y pulsa Comprobar.</p>');return;}
  if(S.noFb){
    S.answers[it.id]=v;
    S.res[it.id]=r.ok?'first':'fail';
    S.i++;
    if(S.i>=S.queue.length) return summary(); else return exercise();
  }
  if(r.ok){
    S.done=true;
    const status=(S.att===0&&!S.hint)?'first':'help';
    S.streak++;
    finishItem(status);
    const extra=S.streak===3?'<p>Tres seguidas: ¡vas en racha!</p>':'';
    fb('ok',pick(OKS),`<p>${fm(it.e)}</p>${extra}`,'Siguiente');
    lock();setTimeout(()=>{const b=$('#bnext');if(b)b.focus();},0);
    return;
  }
  S.att++;S.streak=0;
  if(S.att===1){
    S.hint=true;
    fb('warn',pick(['Buen intento, vamos a afinarlo.','Casi, no te rindas.','Todavía no, pero vas por buen camino.']),`<p>${esc(r.msg)}</p><p><strong>Pista:</strong> ${fm(it.h)}</p><p>Inténtalo de nuevo.</p>`);
    inp.focus();inp.select();
  } else reveal(true);
}
function reveal(auto){
  const it=S.queue[S.i];
  S.done=true;S.streak=0;
  finishItem('fail');
  if(S.i<S.orig.length&&!S.again[it.id]){S.queue.push(it);S.again[it.id]='pending';}
  fb('bad',auto?'No pasa nada: así se aprende. Vamos a verlo paso a paso.':'Vamos a verlo paso a paso.',`<p>Solución: <span class="sol">${fm(solText(it))}</span></p><p>${fm(it.e)}</p><p>Lo repasaremos al final para que te quede.</p>`,'Siguiente');
  lock();setTimeout(()=>{const b=$('#bnext');if(b)b.focus();},0);
}
function next(){
  S.i++;
  if(S.i>=S.queue.length) summary(); else exercise();
}
function summary(){
  const m=MODS[S.mod];
  const total=S.orig.length;
  let pts=0;S.orig.forEach(it=>{const r=S.res[it.id];pts+=r==='first'?1:r==='help'?.5:0;});
  const pct=Math.round(pts/total*100);
  if(!S.retry&&(PROG[S.mod]==null||pct>PROG[S.mod])){PROG[S.mod]=pct;saveProg();}
  const first=S.orig.filter(it=>S.res[it.id]==='first').length;
  let msg;
  if(S.noFb){
    const g=(first).toFixed(0);
    msg=`Nota: ${g} sobre ${total}`;
  } else msg=`${first} de ${total} a la primera`;
  const tone=pct>=90?'Tema dominado. Puedes pasar al siguiente.':pct>=60?'Vas bien. Repasa los que fallaste y este tema estará listo.':'Toca repasar la regla clave y volver a intentarlo: cada fallo te enseña algo.';
  const glyph={first:'✓',help:'~',fail:'✗'};
  const rows=S.orig.map(it=>{
    const r=S.res[it.id]||'fail';
    const q=it.k==='N'?fm(it.q):esc(it.q).replace(/([A-Za-z\)])(\d+)/g,'$1<sub>$2</sub>');
    const yours=S.noFb&&S.answers[it.id]!=null?` Tu respuesta: ${esc(S.answers[it.id]||'(vacía)')}.`:'';
    const detail=(r==='fail')?`<div class="a">Solución: ${fm(solText(it))}.${yours} ${fm(it.e)}</div>`:(r==='help'?`<div class="a">Con ayuda: ${fm(solText(it))}</div>`:`<div class="a">${fm(solText(it))}</div>`);
    return `<li><span class="g ${r}" aria-label="${r==='first'?'Acertado a la primera':r==='help'?'Acertado con ayuda':'Fallado'}">${glyph[r]}</span><div><div class="q">${q}</div>${detail}</div></li>`;
  }).join('');
  const failed=S.orig.filter(it=>S.res[it.id]!=='first');
  S.failedIds=failed.map(i=>i.id);
  const nextMod=S.mod<MODS.length-1;
  $('#app').innerHTML=`
  <div class="topbar"><button class="btn" data-act="home">← Temas</button></div>
  <div class="modhead" style="--mh:${m.mh}"><h2>${esc(m.n)}</h2></div>
  <div class="score">${msg}</div><p class="lead">${tone}</p>
  <ul class="rev">${rows}</ul>
  <div class="actions">
   ${failed.length?`<button class="btn primary" data-act="retryf">Repetir los que no acerté a la primera</button>`:''}
   <button class="btn" data-act="again">Repetir el tema con otros ejercicios</button>
   ${nextMod?`<button class="btn ${failed.length?'':'primary'}" data-act="nextmod">Siguiente tema</button>`:''}
  </div>`;
  window.scrollTo(0,0);
}

/* ============ EVENTOS ============ */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='open')start(+b.dataset.i);
  else if(a==='home')home();
  else if(a==='check')submit();
  else if(a==='next')next();
  else if(a==='hint'){
    if(S.done)return;const it=S.queue[S.i];S.hint=true;
    fb('warn','Pista',`<p>${fm(it.h)}</p>`);$('#ans').focus();
  } else if(a==='sol'){
    if(S.done)return;
    if(S.att===0&&!S.hint){S.hint=true;const it=S.queue[S.i];fb('warn','Primero una pista',`<p>${fm(it.h)}</p><p>Inténtalo. Si sigues atascado, pulsa Mostrar solución otra vez.</p>`);$('#ans').focus();}
    else reveal(false);
  } else if(a==='ins'){
    const i=$('#ans');if(!i||i.disabled)return;const p=i.selectionStart==null?i.value.length:i.selectionStart;
    i.value=i.value.slice(0,p)+b.dataset.c+i.value.slice(i.selectionEnd==null?p:i.selectionEnd);i.focus();i.setSelectionRange(p+1,p+1);
  } else if(a==='again')start(S.mod);
  else if(a==='retryf'){const ids=new Set(S.failedIds);const its=S.orig.filter(x=>ids.has(x.id));start(S.mod,order(its),'retry');}
  else if(a==='nextmod')start(S.mod+1);
  else if(a==='reset'){PROG={};saveProg();home();}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(S.view!=='ex')return;
  if(S.done){const n=$('#bnext');if(n){e.preventDefault();next();}return;}
  if(e.target&&e.target.id==='ans'){e.preventDefault();submit();}
});
home();
</script>
</body>
</html>
