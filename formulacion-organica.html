<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formulación orgánica · 2º Bachillerato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,500&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --paper:#F1F3EC;
  --paper-strong:#E8EBE1;
  --paper-line:#D7DCCC;
  --ink:#182534;
  --ink-soft:#4C5A5A;
  --ink-faint:#7C877F;
  --bond:#2B6E6B;
  --bond-strong:#1F4F4D;
  --accent:#B8791E;
  --accent-soft:#F3E3C4;
  --good:#3E7D48;
  --good-soft:#DCEEDC;
  --bad:#AC4335;
  --bad-soft:#F6DFD9;
  --card:#FFFFFF;
  --card-border:#E1E4D8;
  --shadow: 0 1px 2px rgba(24,37,52,.06);
  --radius-card: 14px;
  --radius-pill: 999px;
  --header-h: 116px;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#141A18;
    --paper-strong:#1A2220;
    --paper-line:#26302B;
    --ink:#ECEFE7;
    --ink-soft:#B7C2B9;
    --ink-faint:#8B978C;
    --bond:#6FBDB6;
    --bond-strong:#8FD6CE;
    --accent:#E0A94C;
    --accent-soft:#3B2F16;
    --good:#7BCB86;
    --good-soft:#1E3222;
    --bad:#E38677;
    --bad-soft:#3A211D;
    --card:#1B2220;
    --card-border:#2A332E;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#141A18;
  --paper-strong:#1A2220;
  --paper-line:#26302B;
  --ink:#ECEFE7;
  --ink-soft:#B7C2B9;
  --ink-faint:#8B978C;
  --bond:#6FBDB6;
  --bond-strong:#8FD6CE;
  --accent:#E0A94C;
  --accent-soft:#3B2F16;
  --good:#7BCB86;
  --good-soft:#1E3222;
  --bad:#E38677;
  --bad-soft:#3A211D;
  --card:#1B2220;
  --card-border:#2A332E;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth; scroll-padding-top: calc(var(--header-h) + 14px); }
html,body{height:100%;}
body{
  margin:0;
  background:
    linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px,
    var(--paper);
  color:var(--ink);
  font-family:"Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size:16.5px;
  line-height:1.55;
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}
h1,h2,h3{
  font-family:"Literata", Georgia, "Times New Roman", serif;
  color:var(--ink);
  margin:0 0 .4em;
  line-height:1.2;
}
h2{font-size:1.5rem; font-weight:600;}
h3{font-size:1.12rem; font-weight:600;}
p{margin:0 0 .8em;}
a{color:var(--bond-strong);}
.mono, .formula, .rformula{
  font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
sub{font-size:.72em;}
.wrap{max-width:980px; margin:0 auto; padding:0 20px;}
.skip-link{position:absolute; left:-999px; top:0; background:var(--ink); color:var(--paper); padding:8px 14px; border-radius:0 0 8px 0; z-index:100;}
.skip-link:focus{left:0;}

/* ---------- header ---------- */
header.site{
  padding: calc(18px + env(safe-area-inset-top,0px)) 0 12px;
  border-bottom:1px solid var(--paper-line);
  background:var(--paper-strong);
}
.header-row{display:flex; align-items:flex-start; justify-content:space-between; gap:16px;}
.site h1{font-size:1.55rem; font-weight:700; letter-spacing:-.01em;}
.site .tagline{color:var(--ink-soft); font-size:.98rem; max-width:56ch;}
.theme-btn{
  border:1px solid var(--card-border); background:var(--card); color:var(--ink);
  border-radius:var(--radius-pill); padding:8px 12px; font-size:.85rem; cursor:pointer;
  font-family:inherit; white-space:nowrap; flex:none;
}
.theme-btn:hover{border-color:var(--bond);}

/* ---------- nav tabs ---------- */
nav.tabs{
  position:sticky; top:0; z-index:20;
  background:var(--paper-strong);
  border-bottom:1px solid var(--paper-line);
  padding-top:env(safe-area-inset-top,0px);
}
.tabs-scroll{
  display:flex; gap:6px; overflow-x:auto; padding:10px 20px; max-width:980px; margin:0 auto;
  scrollbar-width:thin;
}
.tabs-scroll::-webkit-scrollbar{height:6px;}
.tabs-scroll::-webkit-scrollbar-thumb{background:var(--paper-line); border-radius:4px;}
.tab{
  flex:none; font-size:.86rem; padding:7px 13px; border-radius:var(--radius-pill);
  background:transparent; border:1px solid transparent; color:var(--ink-soft);
  text-decoration:none; white-space:nowrap; cursor:pointer;
}
.tab[data-fam="hidro"]{--fam:#3E6E52;}
.tab[data-fam="halo"]{--fam:#8A5A2E;}
.tab[data-fam="oxi"]{--fam:#2B5F8A;}
.tab[data-fam="nitro"]{--fam:#6E4189;}
.tab[data-fam="poli"]{--fam:#AC4335;}
.tab:hover{border-color:var(--card-border); color:var(--ink);}
.tab.active{background:var(--fam,var(--bond)); border-color:transparent; color:#fff;}

/* ---------- sections ---------- */
main{padding-bottom:80px;}
section{padding:46px 0; border-bottom:1px dashed var(--paper-line); scroll-margin-top: calc(var(--header-h) + 10px);}
section:last-of-type{border-bottom:none;}
.eyebrow{font-family:"JetBrains Mono", monospace; font-size:.72rem; color:var(--ink-faint); letter-spacing:.02em;}
.fam-tag{display:inline-block; font-size:.72rem; padding:2px 9px; border-radius:var(--radius-pill); margin-bottom:8px; color:#fff;}
.fam-tag.hidro{background:#3E6E52;}
.fam-tag.halo{background:#8A5A2E;}
.fam-tag.oxi{background:#2B5F8A;}
.fam-tag.nitro{background:#6E4189;}
.fam-tag.poli{background:#AC4335;}

/* ---------- hero ---------- */
.hero{display:grid; grid-template-columns:1.15fr 1fr; gap:34px; align-items:center;}
@media (max-width:760px){.hero{grid-template-columns:1fr;}}
.hero-molecule{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius-card);
  padding:28px 20px; text-align:center; box-shadow:var(--shadow);
}
.hero-molecule .rformula{font-size:1.35rem; letter-spacing:.01em;}
.hero-molecule .hname{
  margin-top:14px; font-family:"Literata", serif; font-weight:600; font-size:1.15rem; color:var(--bond-strong);
  opacity:0; transform:translateY(6px);
  animation: reveal .6s ease .5s forwards;
}
@keyframes reveal{to{opacity:1; transform:none;}}
.cta-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}
.btn{
  font-family:inherit; font-size:.92rem; font-weight:600; padding:10px 16px; border-radius:var(--radius-pill);
  border:1px solid var(--bond); background:var(--bond); color:#fff; cursor:pointer; text-decoration:none;
  display:inline-flex; align-items:center; gap:6px;
}
.btn.ghost{background:transparent; color:var(--bond-strong);}
.btn:hover{filter:brightness(1.06);}
.btn:disabled{opacity:.5; cursor:default;}

/* ---------- cards ---------- */
.card{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius-card);
  padding:20px 22px; box-shadow:var(--shadow);
}
.card + .card{margin-top:14px;}
.rules{margin:0; padding-left:1.2em;}
.rules li{margin-bottom:.5em;}
.tip{
  margin-top:14px; padding:12px 14px; border-radius:10px; background:var(--accent-soft);
  border-left:3px solid var(--accent); font-size:.93rem;
}
.tip b{color:var(--accent);}

/* ---------- compound / formula display ---------- */
.examples{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; margin-top:14px;}
.compound{
  background:var(--card); border:1px solid var(--card-border); border-radius:12px;
  padding:14px 14px 12px; text-align:center;
}
.compound .rformula{font-size:1.02rem; word-break:break-word;}
.compound .cname{margin-top:8px; font-size:.88rem; color:var(--ink-soft);}
.compound .calts{font-size:.76rem; color:var(--ink-faint); margin-top:2px;}
.bond{color:var(--bond); font-weight:600; padding:0 1px;}
.bond2{color:var(--bond-strong); font-weight:700;}
.bond3{color:var(--bond-strong); font-weight:800;}
.grp{color:var(--accent); font-weight:700; border-bottom:2px solid var(--accent-soft); padding-bottom:1px;}
.ring-svg{max-width:170px; margin:0 auto;}
.ring-svg text{font-family:"JetBrains Mono", monospace; fill:var(--ink);}
.ring-svg .edge{stroke:var(--bond); stroke-width:2.4;}
.ring-svg .subline{stroke:var(--ink-soft); stroke-width:2;}
.ring-svg .exo{stroke:var(--accent); stroke-width:2.4;}
.ring-svg .sublabel{fill:var(--ink);}
.ring-svg .sublabel.grp{fill:var(--accent); font-weight:700;}

/* ---------- priority table ---------- */
table.priority{width:100%; border-collapse:collapse; font-size:.92rem;}
table.priority th, table.priority td{padding:9px 10px; text-align:left; border-bottom:1px solid var(--paper-line);}
table.priority th{font-family:"Literata",serif; font-weight:600; color:var(--ink-soft); font-size:.82rem;}
table.priority td.rk{font-family:"JetBrains Mono",monospace; color:var(--ink-faint); width:2em;}
table.priority tr.always td{color:var(--ink-faint); font-style:italic;}
.pf{font-family:"JetBrains Mono",monospace; color:var(--bond-strong);}

/* ---------- quiz ---------- */
details.practice{
  margin-top:16px; border:1px solid var(--card-border); border-radius:var(--radius-card); background:var(--card);
  box-shadow:var(--shadow); overflow:hidden;
}
details.practice > summary{
  cursor:pointer; list-style:none; padding:14px 18px; font-weight:600; color:var(--bond-strong);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
details.practice > summary::-webkit-details-marker{display:none;}
details.practice > summary::after{content:"Practicar ▸"; font-size:.85rem; font-weight:600; color:var(--bond);}
details.practice[open] > summary::after{content:"Ocultar ▾";}
.progress-pill{font-family:"JetBrains Mono",monospace; font-size:.74rem; color:var(--ink-faint); background:var(--paper); border-radius:var(--radius-pill); padding:2px 9px;}
.quiz-body{padding:4px 18px 20px;}
.q-formula{font-size:1.2rem; text-align:center; padding:16px 10px;}
.q-prompt{font-size:.86rem; text-transform:none; color:var(--ink-faint); text-align:center; margin-bottom:2px;}
.q-name{font-family:"Literata",serif; font-weight:600; font-size:1.18rem; text-align:center; padding:14px 10px; color:var(--bond-strong);}
.q-options{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;}
@media (max-width:520px){.q-options{grid-template-columns:1fr;}}
.q-opt{
  font-family:inherit; text-align:left; font-size:.92rem; padding:10px 12px; border-radius:10px;
  border:1px solid var(--card-border); background:var(--paper); cursor:pointer; color:var(--ink);
}
.q-opt:hover{border-color:var(--bond);}
.q-opt.correct{background:var(--good-soft); border-color:var(--good); color:var(--good);}
.q-opt.wrong{background:var(--bad-soft); border-color:var(--bad); color:var(--bad);}
.q-opt[disabled]{cursor:default;}
.q-feedback{margin-top:12px; font-size:.9rem; min-height:1.4em;}
.q-feedback.good{color:var(--good);}
.q-feedback.bad{color:var(--bad);}
.q-foot{display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:10px; flex-wrap:wrap;}

/* ---------- lists ---------- */
.err-list, .trivia-list{list-style:none; margin:0; padding:0; display:grid; gap:10px;}
.err-list li, .trivia-item{
  background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:13px 15px; font-size:.94rem;
}
.err-list li b{color:var(--bad);}
.trivia-item b{color:var(--bond-strong);}
.mnemo{
  background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:16px 18px; margin-bottom:12px;
}
.mnemo h3{margin-bottom:6px; font-size:1rem;}
.mnemo .phrase{font-style:italic; color:var(--bond-strong); font-size:1.02rem;}

/* ---------- reto ---------- */
.reto-box{text-align:center;}
.reto-stats{display:flex; justify-content:center; gap:26px; margin:14px 0 6px; font-family:"JetBrains Mono",monospace;}
.reto-stats div{font-size:.78rem; color:var(--ink-faint);}
.reto-stats span{display:block; font-size:1.5rem; color:var(--ink); font-weight:700;}

footer{padding:34px 0 calc(34px + env(safe-area-inset-bottom,0px)); text-align:center; color:var(--ink-faint); font-size:.84rem;}
footer a{color:var(--ink-faint);}
.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
</style>
</head>

<header class="site">
  <div class="wrap header-row">
    <div>
      <span class="eyebrow">Profe Juanjo Virtual</span>
      <h1>Formulación orgánica</h1>
      <p class="tagline">Nomenclatura IUPAC para 2º de Bachillerato: teoría resumida y práctica interactiva, bloque a bloque.</p>

<main id="inicio">
<div class="wrap" id="content"></div>
</main>

<footer>

const ALL = RAW.trim().split('\n')
  .map(l=>l.trim())
  .filter(l=>l && !l.startsWith('#'))
  .map(line=>{
    const parts = line.split('|');
    return {
      block: parts[0],
      formula: parts[1],
      name: parts[2],
      alts: (parts[3]||'').split(';').map(s=>s.trim()).filter(Boolean),
      groups: (parts[4]||'').split(',').map(s=>s.trim()).filter(Boolean)
    };
  });
const byBlock = id => ALL.filter(c=>c.block===id);

const GROUP_TOKEN = {
  alcoholes:['OH'], eteres:['O'], aldehidos:['CHO'], cetonas:['CO'],
  acidos:['COOH'], esteres:['COO'], aminas:['NH2','N'], amidas:['CONH2','CON'],
  nitrilos:['CN'], nitroderivados:['NO2'],
  halogenados:['F','Cl','Br','I']
};
const HILITE_RAW = {
  alcoholes: /OH/g,
  eteres: /(?<=-)O(?=-)/g,
  aldehidos: /CHO/g,
  cetonas: /CO(?!O)/g,
  acidos: /COOH/g,
  esteres: /COO/g,
  aminas: /NH2|NH(?!\d)|N(?=\()/g,
  amidas: /CONH2|CON(?=\()/g,
  nitrilos: /C\u2261N|CN/g,
  nitroderivados: /NO2/g,
  halogenados: /Cl|Br|F(?![a-z])|I(?![a-z])/g
};

function fmtText(s){
  if(s==null) return '';
  let out = String(s);
  /* las subíndices deben resolverse ANTES de introducir HTML, para que los
     dígitos de las clases (bond2, bond3) no se confundan con subíndices */
  /* el carácter marcador de resaltado (\u0002) puede colarse entre una letra
     y su subíndice (p.ej. "Cl\u00022" en halogenados); se tolera y se conserva */
  out = out.replace(/([A-Za-z\)\]])(\u0002?)(\d+)/g, '$1$2<sub>$3</sub>');
  out = out.replace(/-|=|\u2261/g, function(m){
    if(m === '-') return '<span class="bond">\u2013</span>';
    if(m === '=') return '<span class="bond bond2">=</span>';
    return '<span class="bond bond3">\u2261</span>';
  });
  return out;
}

function fmtChain(raw, block){
  let marked = raw;
  const re = HILITE_RAW[block];
  if(re){
    re.lastIndex = 0;
    marked = raw.replace(re, m => '\u0001'+m+'\u0002');
  }
  let html = fmtText(marked);
  html = html.replace(/\u0001/g,'<span class="grp">').replace(/\u0002/g,'</span>');
  return html;
}

/* subíndices válidos dentro de <text> SVG (no se puede usar <sub> de HTML) */
function fmtSvgLabel(s){
  s = String(s);
  let out = '', i = 0;
  while(i < s.length){
    if(/[A-Za-z\)\]]/.test(s[i]) && /\d/.test(s[i+1]||'')){
      out += s[i]; i++;
      let digits = '';
      while(/\d/.test(s[i]||'')){ digits += s[i]; i++; }
      out += `<tspan baseline-shift="-6" font-size="0.72em">${digits}</tspan>`;
    } else {
      out += s[i]; i++;
    }
  }
  return out;
}

/* --- generador de anillos --- */
function ringSVG(spec, block){
  const parts = spec.trim().split(/\s+/);
  const n = parseInt(parts[0].slice(1),10);
  let aromatic=false;
  const doubleEdges = new Set();
  const subs = {};   // idx -> [labels]
  const exo = {};    // idx -> label (doble enlace exocíclico, p.ej. =O)
  for(let i=1;i<parts.length;i++){
    const p = parts[i];
    let m;
    if(p==='a'){ aromatic = true; }
    else if((m=p.match(/^d(\d+)$/))){ doubleEdges.add(parseInt(m[1],10)); }
    else if((m=p.match(/^v(\d+)=(.+)$/))){ const idx=m[1]; (subs[idx]=subs[idx]||[]).push(m[2]); }
    else if((m=p.match(/^w(\d+)=(.+)$/))){ exo[m[1]] = m[2]; }
  }
  if(aromatic){ for(let e=0;e<n;e+=2) doubleEdges.add(e); }

  const size = 210, cx = size/2, cy = size/2 + 2, R = 46;
  const pt = i => {
    const ang = (-90 + i*(360/n)) * Math.PI/180;
    return [cx + R*Math.cos(ang), cy + R*Math.sin(ang)];
  };
  let svg = `<svg class="ring-svg" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">`;

  for(let i=0;i<n;i++){
    const [x1,y1] = pt(i), [x2,y2] = pt((i+1)%n);
    svg += `<line class="edge" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
    if(doubleEdges.has(i)){
      const mx=(x1+x2)/2, my=(y1+y2)/2;
      const inx = cx-mx, iny = cy-my; const len=Math.hypot(inx,iny)||1;
      const ox = x1 + (inx/len)*7, oy = y1 + (iny/len)*7;
      const ox2 = x2 + (inx/len)*7, oy2 = y2 + (iny/len)*7;
      svg += `<line class="edge" x1="${ox.toFixed(1)}" y1="${oy.toFixed(1)}" x2="${ox2.toFixed(1)}" y2="${oy2.toFixed(1)}"/>`;
    }
  }

  Object.keys(subs).forEach(idx=>{
    const labels = subs[idx];
    const i = parseInt(idx,10);
    const [vx,vy] = pt(i);
    const baseAng = (-90 + i*(360/n));
    const spread = labels.length>1 ? [-18,18] : [0];
    labels.forEach((label,k)=>{
      const ang = (baseAng + (spread[k]||0)) * Math.PI/180;
      const ex = vx + 26*Math.cos(ang), ey = vy + 26*Math.sin(ang);
      const lx = vx + 40*Math.cos(ang), ly = vy + 40*Math.sin(ang);
      svg += `<line class="subline" x1="${vx.toFixed(1)}" y1="${vy.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}"/>`;
      const isGrp = (GROUP_TOKEN[block]||[]).some(tok => label.includes(tok));
      svg += `<text class="sublabel${isGrp?' grp':''}" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="13" text-anchor="${Math.cos(ang)>0.2?'start':(Math.cos(ang)<-0.2?'end':'middle')}" dominant-baseline="middle">${fmtSvgLabel(label)}</text>`;
    });
  });

  Object.keys(exo).forEach(idx=>{
    const label = exo[idx];
    const i = parseInt(idx,10);
    const [vx,vy] = pt(i);
    const baseAng = (-90 + i*(360/n)) * Math.PI/180;
    const ex = vx + 26*Math.cos(baseAng), ey = vy + 26*Math.sin(baseAng);
    const lx = vx + 40*Math.cos(baseAng), ly = vy + 40*Math.sin(baseAng);
    const perpx = -Math.sin(baseAng)*3, perpy = Math.cos(baseAng)*3;
    svg += `<line class="exo" x1="${(vx+perpx).toFixed(1)}" y1="${(vy+perpy).toFixed(1)}" x2="${(ex+perpx).toFixed(1)}" y2="${(ey+perpy).toFixed(1)}"/>`;
    svg += `<line class="exo" x1="${(vx-perpx).toFixed(1)}" y1="${(vy-perpy).toFixed(1)}" x2="${(ex-perpx).toFixed(1)}" y2="${(ey-perpy).toFixed(1)}"/>`;
    svg += `<text class="sublabel grp" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="13" text-anchor="middle" dominant-baseline="middle">${fmtSvgLabel(label)}</text>`;
  });

  svg += `</svg>`;
  return svg;
}

function renderFormula(compound){
  if(compound.formula.startsWith('@')){
    return ringSVG(compound.formula, compound.block);
  }
  return `<div class="rformula">${fmtChain(compound.formula, compound.block)}</div>`;
}

function compoundCard(c, opts){
  opts = opts || {};
  const altsHtml = (c.alts && c.alts.length) ? `<div class="calts">${c.alts.join(' · ')}</div>` : '';
  const nameHtml = opts.hideName ? '' : `<div class="cname">${c.name}</div>${altsHtml}`;
  return `<div class="compound">${renderFormula(c)}${nameHtml}</div>`;
}


/* ======================================================================
   PROGRESO (localStorage)
   ====================================================================== */
const LS_KEY = 'organica_progreso_v1';
function loadProgress(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(p)); }catch(e){}
}
let PROGRESS = loadProgress();
function bumpProgress(block, ok){
  PROGRESS[block] = PROGRESS[block] || {a:0,c:0};
  PROGRESS[block].a++;
  if(ok) PROGRESS[block].c++;
  saveProgress(PROGRESS);
  updateProgressPill(block);
}
function updateProgressPill(block){
  const el = document.querySelector(`.progress-pill[data-block="${block}"]`);
  if(!el) return;
  const p = PROGRESS[block];
  el.textContent = p && p.a ? `${p.c}/${p.a} aciertos` : 'sin intentos aún';
}

/* ======================================================================
   MOTOR DE PREGUNTAS
   ====================================================================== */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function pickQuestion(pool){
  const c = pool[Math.floor(Math.random()*pool.length)];
  const type = Math.random() < 0.5 ? 'formula2name' : 'name2formula';
  const distractors = shuffle(pool.filter(x=>x!==c)).slice(0,3);
  const options = shuffle([c, ...distractors]);
  return {c, type, options};
}

function renderQuestion(container, pool, block){
  const q = pickQuestion(pool);
  let head, optsHtml;
  if(q.type === 'formula2name'){
    head = `<div class="q-prompt">¿Cómo se llama este compuesto?</div><div class="q-formula">${renderFormula(q.c)}</div>`;
    optsHtml = q.options.map((o,i)=>`<button class="q-opt" data-ok="${o===q.c}" data-i="${i}">${o.name}</button>`).join('');
  }else{
    head = `<div class="q-prompt">¿Cuál es la fórmula de...?</div><div class="q-name">${q.c.name}</div>`;
    optsHtml = q.options.map((o,i)=>`<button class="q-opt" data-ok="${o===q.c}" data-i="${i}">${renderFormula(o)}</button>`).join('');
  }
  container.innerHTML = `
    ${head}
    <div class="q-options">${optsHtml}</div>
    <div class="q-feedback" role="status"></div>
    <div class="q-foot">
      <span class="progress-pill" data-block="${block}"></span>
      <button class="btn ghost next-btn" type="button" hidden>Siguiente pregunta →</button>
    </div>`;
  updateProgressPill(block);

  const fb = container.querySelector('.q-feedback');
  const nextBtn = container.querySelector('.next-btn');
  const opts = container.querySelectorAll('.q-opt');
  opts.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      opts.forEach(b=>b.disabled = true);
      const ok = btn.dataset.ok === 'true';
      btn.classList.add(ok?'correct':'wrong');
      if(!ok){
        const correctBtn = Array.from(opts).find(b=>b.dataset.ok==='true');
        if(correctBtn) correctBtn.classList.add('correct');
      }
      fb.textContent = ok ? 'Correcto.' : `No es correcto. La respuesta era: ${q.type==='formula2name' ? q.c.name : q.c.name}.`;
      fb.className = 'q-feedback ' + (ok?'good':'bad');
      bumpProgress(block, ok);
      nextBtn.hidden = false;
      nextBtn.focus();
    });
  });
  nextBtn.addEventListener('click', ()=> renderQuestion(container, pool, block));
}

function mountBlockQuiz(block){
  const el = document.getElementById('quiz-'+block);
  if(!el) return;
  const pool = byBlock(block);
  const details = el.closest('details.practice');
  let mounted = false;
  const mount = ()=>{ if(!mounted){ mounted = true; renderQuestion(el, pool, block); } };
  if(details.open) mount();
  details.addEventListener('toggle', ()=>{ if(details.open) mount(); });
}

/* ======================================================================
   RETO MIXTO CRONOMETRADO
   ====================================================================== */
function initReto(){
  const startBtn = document.getElementById('reto-start');
  const box = document.getElementById('reto-question');
  const timeEl = document.getElementById('reto-time');
  const scoreEl = document.getElementById('reto-score');
  const bestEl = document.getElementById('reto-best');
  const RETO_KEY = 'organica_reto_best_v1';
  let best = 0;
  try{ best = parseInt(localStorage.getItem(RETO_KEY)||'0',10) || 0; }catch(e){}
  bestEl.textContent = best;

  let timer = null, timeLeft = 60, score = 0, running = false;

  function endGame(){
    running = false;
    clearInterval(timer);
    startBtn.disabled = false;
    startBtn.textContent = 'Jugar de nuevo';
    box.innerHTML = `<p>¡Tiempo! Has acertado <b>${score}</b> compuesto${score===1?'':'s'}.</p>`;
    if(score > best){
      best = score;
      try{ localStorage.setItem(RETO_KEY, String(best)); }catch(e){}
      bestEl.textContent = best;
    }
  }

  function nextRetoQuestion(){
    const q = pickQuestion(ALL);
    let head, optsHtml;
    if(q.type === 'formula2name'){
      head = `<div class="q-prompt">¿Cómo se llama?</div><div class="q-formula">${renderFormula(q.c)}</div>`;
      optsHtml = q.options.map(o=>`<button class="q-opt" data-ok="${o===q.c}">${o.name}</button>`).join('');
    }else{
      head = `<div class="q-prompt">¿Cuál es la fórmula de...?</div><div class="q-name">${q.c.name}</div>`;
      optsHtml = q.options.map(o=>`<button class="q-opt" data-ok="${o===q.c}">${renderFormula(o)}</button>`).join('');
    }
    box.innerHTML = `${head}<div class="q-options">${optsHtml}</div>`;
    box.querySelectorAll('.q-opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(!running) return;
        const ok = btn.dataset.ok === 'true';
        if(ok){ score++; scoreEl.textContent = score; }
        else { btn.classList.add('wrong'); }
        nextRetoQuestion();
      });
    });
  }

  startBtn.addEventListener('click', ()=>{
    running = true;
    score = 0; timeLeft = 60;
    scoreEl.textContent = '0';
    timeEl.textContent = String(timeLeft);
    startBtn.disabled = true;
    startBtn.textContent = 'Jugando...';
    nextRetoQuestion();
    timer = setInterval(()=>{
      timeLeft--;
      timeEl.textContent = String(timeLeft);
      if(timeLeft<=0) endGame();
    },1000);
  });
}

        <div class="quiz-body" id="quiz-polifuncionales"></div>
      </details>
    </section>`;

  const erroresHtml = `
    <section id="errores">
      <span class="eyebrow">Para no fallar en el examen</span>
      <h2>Errores típicos</h2>
      <ul class="err-list">${MISTAKES.map(m=>`<li>${m}</li>`).join('')}</ul>
    </section>`;

  const mnemosHtml = `
    <section id="trucos">
      <span class="eyebrow">Trucos</span>
      <h2>Mnemotecnias</h2>
      ${MNEMOS.slice(1).map(m=>`<div class="mnemo"><h3>${m.t}</h3><p class="phrase">${m.p}</p><p>${m.d}</p></div>`).join('')}
    </section>`;

  const curiosidadesHtml = `
    <section id="curiosidades">
      <span class="eyebrow">Química de cada día</span>
      <h2>Compuestos que ya conoces</h2>
      <ul class="trivia-list">${TRIVIA.map(t=>`<li class="trivia-item"><b>${t.name}</b> — ${t.note}</li>`).join('')}</ul>
    </section>`;

  const retoHtml = `
    <section id="reto">
      <span class="eyebrow">Repaso mixto</span>
      <h2>Reto contrarreloj</h2>
      <div class="card reto-box">
        <p>60 segundos, compuestos de todos los bloques mezclados. ¿Cuántos aciertas?</p>
        <div class="reto-stats">
          <div>Tiempo<span id="reto-time">60</span></div>
          <div>Aciertos<span id="reto-score">0</span></div>
          <div>Mejor marca<span id="reto-best">0</span></div>
        </div>
        <button class="btn" id="reto-start" type="button">Empezar reto</button>
        <div id="reto-question" style="margin-top:18px;"></div>
      </div>
    </section>`;

  content.innerHTML = heroHtml + prioridadHtml + blockSections + poliHtml + erroresHtml + mnemosHtml + curiosidadesHtml + retoHtml;

  // pestañas de navegación
  const navItems = [{id:'prioridad', label:'Prioridad', fam:'poli'}];
  BLOCKS.forEach(b=> navItems.push({id:b.topic, label:b.name, fam:b.fam}));
  navItems.push({id:'errores', label:'Errores', fam:'poli'});
  navItems.push({id:'trucos', label:'Trucos', fam:'poli'});
  navItems.push({id:'curiosidades', label:'Curiosidades', fam:'poli'});
  navItems.push({id:'reto', label:'Reto', fam:'poli'});
  const seen = new Set();
  tabsScroll.innerHTML = navItems.filter(n=>{
    if(seen.has(n.id)) return false; seen.add(n.id); return true;
  }).map(n=>`<a class="tab" data-fam="${n.fam}" href="#${n.id}">${n.label}</a>`).join('');

  BLOCKS.forEach(b=> mountBlockQuiz(b.id));
  mountBlockQuiz('polifuncionales');
  initReto();
  initScrollSpy();
  initHeader();
}

function initScrollSpy(){
  const tabs = Array.from(document.querySelectorAll('.tab'));
  const targets = tabs.map(t=>document.querySelector(t.getAttribute('href'))).filter(Boolean);
  if(!('IntersectionObserver' in window) || !targets.length) return;
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const id = '#'+entry.target.id;
        tabs.forEach(t=> t.classList.toggle('active', t.getAttribute('href')===id));
      }
    });
  }, {rootMargin: '-40% 0px -55% 0px', threshold: 0});
  targets.forEach(t=> io.observe(t));
}

function initHeader(){
  const btn = document.getElementById('themeBtn');
  let saved = null;
  try{ saved = localStorage.getItem('organica_theme'); }catch(e){}
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  btn.addEventListener('click', ()=>{
    const current = document.documentElement.getAttribute('data-theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = current ? current==='dark' : prefersDark;
    const next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('organica_theme', next); }catch(e){}
  });
  const header = document.querySelector('header.site');
  const nav = document.querySelector('nav.tabs');
  function setHeaderH(){
    document.documentElement.style.setProperty('--header-h', (header.offsetHeight + nav.offsetHeight) + 'px');
  }
  setHeaderH();
  window.addEventListener('resize', setHeaderH);
}

document.addEventListener('DOMContentLoaded', buildPage);

</script>
</body>
</html>
