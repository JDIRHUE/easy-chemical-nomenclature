<title>Test de formulación orgánica · 2º Bachillerato</title>

<style>
:root{
  box-sizing:border-box;
  --paper:#F1F3EC; --paper-strong:#E8EBE1; --paper-line:#D7DCCC;
  --ink:#182534; --ink-soft:#4C5A5A; --ink-faint:#7C877F;
  --bond:#2B6E6B; --bond-strong:#1F4F4D;
  --accent:#B8791E; --accent-soft:#F3E3C4;
  --good:#3E7D48; --good-soft:#DCEEDC;
  --bad:#AC4335; --bad-soft:#F6DFD9;
  --card:#FFFFFF; --card-border:#E1E4D8;
  --shadow:0 1px 2px rgba(24,37,52,.06);
  --radius-card:14px; --radius-pill:999px;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#141A18; --paper-strong:#1A2220; --paper-line:#26302B;
    --ink:#ECEFE7; --ink-soft:#B7C2B9; --ink-faint:#8B978C;
    --bond:#6FBDB6; --bond-strong:#8FD6CE;
    --accent:#E0A94C; --accent-soft:#3B2F16;
    --good:#7BCB86; --good-soft:#1E3222;
    --bad:#E38677; --bad-soft:#3A211D;
    --card:#1B2220; --card-border:#2A332E;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#141A18; --paper-strong:#1A2220; --paper-line:#26302B;
  --ink:#ECEFE7; --ink-soft:#B7C2B9; --ink-faint:#8B978C;
  --bond:#6FBDB6; --bond-strong:#8FD6CE;
  --accent:#E0A94C; --accent-soft:#3B2F16;
  --good:#7BCB86; --good-soft:#1E3222;
  --bad:#E38677; --bad-soft:#3A211D;
  --card:#1B2220; --card-border:#2A332E;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink);
  font-family:"Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size:16.5px; line-height:1.55;
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
h1,h2,h3{font-family:"Literata", Georgia, serif; color:var(--ink); margin:0 0 .4em; line-height:1.2;}
h2{font-size:1.4rem; font-weight:600;}
h3{font-size:1.05rem; font-weight:600;}
p{margin:0 0 .8em;}
.mono,.rformula{font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;}
sub{font-size:.72em;}
.bond{color:var(--bond); font-weight:600; padding:0 1px;}
.bond2{color:var(--bond-strong); font-weight:700;}
.bond3{color:var(--bond-strong); font-weight:800;}
.grp{color:var(--accent); font-weight:700; border-bottom:2px solid var(--accent-soft); padding-bottom:1px;}
.ring-svg text{font-family:"JetBrains Mono", monospace; fill:var(--ink);}
.ring-svg .edge{stroke:var(--bond); stroke-width:2.4;}
.ring-svg .subline{stroke:var(--ink-soft); stroke-width:2;}
.ring-svg .exo{stroke:var(--accent); stroke-width:2.4;}
.ring-svg .sublabel{fill:var(--ink);}
.ring-svg .sublabel.grp{fill:var(--accent); font-weight:700;}
.wrap{max-width:880px; margin:0 auto; padding:0 20px;}
header.site{padding: calc(18px + env(safe-area-inset-top,0px)) 0 14px; border-bottom:1px solid var(--paper-line); background:var(--paper-strong);}
.header-row{display:flex; align-items:flex-start; justify-content:space-between; gap:16px;}
.site h1{font-size:1.4rem; font-weight:700;}
.site .tagline{color:var(--ink-soft); font-size:.95rem; max-width:60ch;}
.eyebrow{font-family:"JetBrains Mono", monospace; font-size:.72rem; color:var(--ink-faint); letter-spacing:.02em;}
.theme-btn{border:1px solid var(--card-border); background:var(--card); color:var(--ink); border-radius:var(--radius-pill); padding:8px 12px; font-size:.85rem; cursor:pointer; font-family:inherit; white-space:nowrap; flex:none;}
main{padding:30px 0 90px;}
.card{background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius-card); padding:20px 22px; box-shadow:var(--shadow);}
.card + .card{margin-top:14px;}
.btn{font-family:inherit; font-size:.92rem; font-weight:600; padding:10px 16px; border-radius:var(--radius-pill); border:1px solid var(--bond); background:var(--bond); color:#fff; cursor:pointer; display:inline-flex; align-items:center; gap:6px;}
.btn.ghost{background:transparent; color:var(--bond-strong);}
.btn.subtle{background:var(--paper); color:var(--ink); border-color:var(--card-border);}
.btn:hover{filter:brightness(1.06);}
.btn:disabled{opacity:.5; cursor:default;}
.field-row{display:flex; flex-wrap:wrap; gap:22px; margin:14px 0;}
.field{min-width:180px;}
.field label{display:block; font-size:.82rem; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
select, input[type="text"]{
  font-family:inherit; font-size:.95rem; padding:8px 10px; border-radius:8px; border:1px solid var(--card-border);
  background:var(--paper); color:var(--ink); width:100%;
}
.blocks-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px; margin-top:8px;}
.blocks-grid label{display:flex; align-items:center; gap:7px; font-size:.88rem; background:var(--paper); border:1px solid var(--card-border); border-radius:8px; padding:7px 10px; cursor:pointer;}
.blocks-grid input{accent-color:var(--bond);}
.radio-row{display:flex; gap:14px; flex-wrap:wrap; margin-top:6px;}
.radio-row label{display:flex; align-items:center; gap:6px; font-size:.9rem; cursor:pointer;}
.fam-toggle{font-size:.78rem; color:var(--bond-strong); cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; font-family:inherit;}

.testhead{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:6px;}
.testcode{font-family:"JetBrains Mono",monospace; font-size:.8rem; color:var(--ink-faint);}
.part-title{margin-top:26px; padding-bottom:6px; border-bottom:2px solid var(--paper-line);}
.exercise{display:grid; grid-template-columns:2.4em 1fr; gap:12px; padding:14px 0; border-bottom:1px solid var(--paper-line); align-items:start;}
.exercise:last-child{border-bottom:none;}
.exnum{font-family:"JetBrains Mono",monospace; color:var(--ink-faint); font-size:.9rem; padding-top:6px;}
.exq .rformula{font-size:1.08rem;}
.exq .ring-svg{max-width:130px;}
.exq .name-prompt{font-family:"Literata",serif; font-weight:600; color:var(--bond-strong); font-size:1.02rem;}
.ex-input{margin-top:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.ex-input input[type="text"]{max-width:340px;}
.ex-fb{font-size:.85rem; padding:3px 9px; border-radius:var(--radius-pill); display:none;}
.ex-fb.good{display:inline-block; background:var(--good-soft); color:var(--good);}
.ex-fb.bad{display:inline-block; background:var(--bad-soft); color:var(--bad);}
.reveal{margin-top:8px; font-size:.92rem; color:var(--ink-soft); display:none; padding:8px 10px; background:var(--accent-soft); border-radius:8px;}
.reveal.show{display:block;}
.reveal b{color:var(--accent);}
.linklike{background:none; border:none; color:var(--bond-strong); text-decoration:underline; cursor:pointer; font-family:inherit; font-size:.85rem; padding:0;}

.score-banner{display:none; margin:18px 0; padding:14px 18px; border-radius:12px; background:var(--good-soft); color:var(--good); font-weight:600;}
.score-banner.show{display:block;}

.toolbar{
  position:sticky; bottom:0; left:0; right:0; background:var(--paper-strong); border-top:1px solid var(--paper-line);
  padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px)); margin-top:20px;
}
.toolbar .wrap{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}

#configPanel.hidden, #testArea.hidden, .toolbar.hidden{display:none;}

.print-only{display:none;}
@media print{
  header.site, .toolbar, .no-print, .theme-btn{display:none !important;}
  body{background:#fff; font-size:12.5pt;}
  .card{box-shadow:none; border:1px solid #ccc;}
  .print-only{display:block;}
  a{color:inherit; text-decoration:none;}
}
footer{padding:24px 0 calc(24px + env(safe-area-inset-bottom,0px)); text-align:center; color:var(--ink-faint); font-size:.82rem;}
</style>
</head>

<header class="site">
  <div class="wrap header-row">
    <div>
      <span class="eyebrow">Profe Juanjo Virtual</span>
      <h1>Test de formulación orgánica</h1>
      <p class="tagline">2º de Bachillerato · genera un test con corrección para practicar antes del examen.</p>
    </div>

<footer class="no-print">Química, 2º de Bachillerato · nomenclatura IUPAC con nombres tradicionales aceptados donde se indica</footer>

/* ======================================================================
   MOTOR DE FÓRMULAS
   ====================================================================== */
const ALL = RAW.trim().split('\n')
  .map(l=>l.trim())
  .filter(l=>l && !l.startsWith('#'))
  .map(line=>{
    const parts = line.split('|');
    return {
      block: parts[0],
      formula: parts[1],
      name: parts[2],
      alts: (parts[3]||'').split(';').map(s=>s.trim()).filter(Boolean),
      groups: (parts[4]||'').split(',').map(s=>s.trim()).filter(Boolean)
    };
  });
const byBlock = id => ALL.filter(c=>c.block===id);

const GROUP_TOKEN = {
  alcoholes:['OH'], eteres:['O'], aldehidos:['CHO'], cetonas:['CO'],
  acidos:['COOH'], esteres:['COO'], aminas:['NH2','N'], amidas:['CONH2','CON'],
  nitrilos:['CN'], nitroderivados:['NO2'],
  halogenados:['F','Cl','Br','I']
};
const HILITE_RAW = {
  alcoholes: /OH/g,
  eteres: /(?<=-)O(?=-)/g,
  aldehidos: /CHO/g,
  cetonas: /CO(?!O)/g,
  acidos: /COOH/g,
  esteres: /COO/g,
  aminas: /NH2|NH(?!\d)|N(?=\()/g,
  amidas: /CONH2|CON(?=\()/g,
  nitrilos: /C\u2261N|CN/g,
  nitroderivados: /NO2/g,
  halogenados: /Cl|Br|F(?![a-z])|I(?![a-z])/g
};

function fmtText(s){
  if(s==null) return '';
  let out = String(s);
  /* las subíndices deben resolverse ANTES de introducir HTML, para que los
     dígitos de las clases (bond2, bond3) no se confundan con subíndices */
  /* el carácter marcador de resaltado (\u0002) puede colarse entre una letra
     y su subíndice (p.ej. "Cl\u00022" en halogenados); se tolera y se conserva */
  out = out.replace(/([A-Za-z\)\]])(\u0002?)(\d+)/g, '$1$2<sub>$3</sub>');
  out = out.replace(/-|=|\u2261/g, function(m){
    if(m === '-') return '<span class="bond">\u2013</span>';
    if(m === '=') return '<span class="bond bond2">=</span>';
    return '<span class="bond bond3">\u2261</span>';
  });
  return out;
}

function fmtChain(raw, block){
  let marked = raw;
  const re = HILITE_RAW[block];
  if(re){
    re.lastIndex = 0;
    marked = raw.replace(re, m => '\u0001'+m+'\u0002');
  }
  let html = fmtText(marked);
  html = html.replace(/\u0001/g,'<span class="grp">').replace(/\u0002/g,'</span>');
  return html;
}

/* subíndices válidos dentro de <text> SVG (no se puede usar <sub> de HTML) */
function fmtSvgLabel(s){
  s = String(s);
  let out = '', i = 0;
  while(i < s.length){
    if(/[A-Za-z\)\]]/.test(s[i]) && /\d/.test(s[i+1]||'')){
      out += s[i]; i++;
      let digits = '';
      while(/\d/.test(s[i]||'')){ digits += s[i]; i++; }
      out += `<tspan baseline-shift="-6" font-size="0.72em">${digits}</tspan>`;
    } else {
      out += s[i]; i++;
    }
  }
  return out;
}

/* --- generador de anillos --- */
function ringSVG(spec, block){
  const parts = spec.trim().split(/\s+/);
  const n = parseInt(parts[0].slice(1),10);
  let aromatic=false;
  const doubleEdges = new Set();
  const subs = {};   // idx -> [labels]
  const exo = {};    // idx -> label (doble enlace exocíclico, p.ej. =O)
  for(let i=1;i<parts.length;i++){
    const p = parts[i];
    let m;
    if(p==='a'){ aromatic = true; }
    else if((m=p.match(/^d(\d+)$/))){ doubleEdges.add(parseInt(m[1],10)); }
    else if((m=p.match(/^v(\d+)=(.+)$/))){ const idx=m[1]; (subs[idx]=subs[idx]||[]).push(m[2]); }
    else if((m=p.match(/^w(\d+)=(.+)$/))){ exo[m[1]] = m[2]; }
  }
  if(aromatic){ for(let e=0;e<n;e+=2) doubleEdges.add(e); }

  const size = 210, cx = size/2, cy = size/2 + 2, R = 46;
  const pt = i => {
    const ang = (-90 + i*(360/n)) * Math.PI/180;
    return [cx + R*Math.cos(ang), cy + R*Math.sin(ang)];
  };
  let svg = `<svg class="ring-svg" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">`;

  for(let i=0;i<n;i++){
    const [x1,y1] = pt(i), [x2,y2] = pt((i+1)%n);
    svg += `<line class="edge" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
    if(doubleEdges.has(i)){
      const mx=(x1+x2)/2, my=(y1+y2)/2;
      const inx = cx-mx, iny = cy-my; const len=Math.hypot(inx,iny)||1;
      const ox = x1 + (inx/len)*7, oy = y1 + (iny/len)*7;
      const ox2 = x2 + (inx/len)*7, oy2 = y2 + (iny/len)*7;
      svg += `<line class="edge" x1="${ox.toFixed(1)}" y1="${oy.toFixed(1)}" x2="${ox2.toFixed(1)}" y2="${oy2.toFixed(1)}"/>`;
    }
  }

  Object.keys(subs).forEach(idx=>{
    const labels = subs[idx];
    const i = parseInt(idx,10);
    const [vx,vy] = pt(i);
    const baseAng = (-90 + i*(360/n));
    const spread = labels.length>1 ? [-18,18] : [0];
    labels.forEach((label,k)=>{
      const ang = (baseAng + (spread[k]||0)) * Math.PI/180;
      const ex = vx + 26*Math.cos(ang), ey = vy + 26*Math.sin(ang);
      const lx = vx + 40*Math.cos(ang), ly = vy + 40*Math.sin(ang);
      svg += `<line class="subline" x1="${vx.toFixed(1)}" y1="${vy.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}"/>`;
      const isGrp = (GROUP_TOKEN[block]||[]).some(tok => label.includes(tok));
      svg += `<text class="sublabel${isGrp?' grp':''}" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="13" text-anchor="${Math.cos(ang)>0.2?'start':(Math.cos(ang)<-0.2?'end':'middle')}" dominant-baseline="middle">${fmtSvgLabel(label)}</text>`;
    });
  });

  Object.keys(exo).forEach(idx=>{
    const label = exo[idx];
    const i = parseInt(idx,10);
    const [vx,vy] = pt(i);
    const baseAng = (-90 + i*(360/n)) * Math.PI/180;
    const ex = vx + 26*Math.cos(baseAng), ey = vy + 26*Math.sin(baseAng);
    const lx = vx + 40*Math.cos(baseAng), ly = vy + 40*Math.sin(baseAng);
    const perpx = -Math.sin(baseAng)*3, perpy = Math.cos(baseAng)*3;
    svg += `<line class="exo" x1="${(vx+perpx).toFixed(1)}" y1="${(vy+perpy).toFixed(1)}" x2="${(ex+perpx).toFixed(1)}" y2="${(ey+perpy).toFixed(1)}"/>`;
    svg += `<line class="exo" x1="${(vx-perpx).toFixed(1)}" y1="${(vy-perpy).toFixed(1)}" x2="${(ex-perpx).toFixed(1)}" y2="${(ey-perpy).toFixed(1)}"/>`;
    svg += `<text class="sublabel grp" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="13" text-anchor="middle" dominant-baseline="middle">${fmtSvgLabel(label)}</text>`;
  });

  svg += `</svg>`;
  return svg;
}

function renderFormula(compound){
  if(compound.formula.startsWith('@')){
    return ringSVG(compound.formula, compound.block);
  }
  return `<div class="rformula">${fmtChain(compound.formula, compound.block)}</div>`;
}

function compoundCard(c, opts){
  opts = opts || {};
  const altsHtml = (c.alts && c.alts.length) ? `<div class="calts">${c.alts.join(' · ')}</div>` : '';
  const nameHtml = opts.hideName ? '' : `<div class="cname">${c.name}</div>${altsHtml}`;
  return `<div class="compound">${renderFormula(c)}${nameHtml}</div>`;
}


function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ===================== normalización de respuestas de texto ===================== */
function normLoose(s){
  return String(s||'')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]/g,'');
}
function answerMatches(typed, compound){
  const t = normLoose(typed);
  if(!t) return false;
  const candidates = [compound.name, ...compound.alts];
  return candidates.some(c => normLoose(c) === t);
}

/* ===================== generación del test ===================== */
function buildTest(n, selectedBlocks, mix){
  const blocksShuffled = shuffle(selectedBlocks);
  const per = Math.floor(n / blocksShuffled.length);
  let remainder = n - per*blocksShuffled.length;
  let chosen = [];
  blocksShuffled.forEach(b=>{
    let take = per + (remainder>0 ? 1 : 0);
    if(remainder>0) remainder--;
    const pool = shuffle(byBlock(b));
    chosen = chosen.concat(pool.slice(0, Math.min(take, pool.length)));
  });
  chosen = shuffle(chosen).slice(0, n);
  chosen = shuffle(chosen);

  let items = chosen.map(c=>{
    let type;
    if(mix==='nombrar') type='f2n';
    else if(mix==='formular') type='n2f';
    else type = null; // se decide tras repartir a partes iguales
    return {c, type};
  });
  if(mix==='mezcla'){
    const half = Math.ceil(items.length/2);
    items.forEach((it,i)=> it.type = i<half ? 'f2n' : 'n2f');
    items = shuffle(items);
  }
  const parte1 = items.filter(it=>it.type==='f2n');
  const parte2 = items.filter(it=>it.type==='n2f');
  return {parte1, parte2};
}

/* ===================== estado ===================== */
let CURRENT_TEST = null;

function selectedBlockIds(){
  return Array.from(document.querySelectorAll('.block-check:checked')).map(el=>el.value);
}

function renderConfig(){
  const famGroups = {};
  BLOCKS.forEach(b=>{ (famGroups[b.fam] = famGroups[b.fam]||[]).push(b); });
  const blocksHtml = Object.keys(famGroups).map(fam=>`
    <div style="margin-top:10px;">
      <span class="eyebrow" style="font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--ink-faint);">${FAMILIES[fam]}</span>
      <div class="blocks-grid">
        ${famGroups[fam].map(b=>`<label><input type="checkbox" class="block-check" value="${b.id}" checked> ${b.name}</label>`).join('')}
      </div>
    </div>`).join('');

  document.getElementById('content').innerHTML = `
    <div id="configPanel">
      <div class="card">
        <h2>Configura tu test</h2>
        <p>Elige cuántos ejercicios quieres y de qué bloques. Se generará un test distinto cada vez que lo pidas.</p>
        <div class="field-row">
          <div class="field">
            <label for="numEj">Nº de ejercicios</label>
            <select id="numEj">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="30">30</option>
              <option value="40">40</option>
              <option value="60">60</option>
            </select>
          </div>
          <div class="field">
            <label>Tipo de ejercicios</label>
            <div class="radio-row">
              <label><input type="radio" name="mix" value="mezcla" checked> Mezcla (nombrar y formular)</label>
              <label><input type="radio" name="mix" value="nombrar"> Solo nombrar</label>
              <label><input type="radio" name="mix" value="formular"> Solo formular</label>
            </div>
          </div>
        </div>
        <div>
          <label style="font-size:.82rem;color:var(--ink-soft);font-weight:600;">Bloques a incluir
            <button type="button" class="fam-toggle" id="toggleAll" style="margin-left:10px;">marcar/desmarcar todos</button>
          </label>
          ${blocksHtml}
        </div>
        <div style="margin-top:18px;">
          <button class="btn" id="genBtn" type="button">Generar test</button>
        </div>
      </div>
    </div>
    <div id="testArea" class="hidden"></div>
  `;

  document.getElementById('toggleAll').addEventListener('click', ()=>{
    const boxes = document.querySelectorAll('.block-check');
    const allChecked = Array.from(boxes).every(b=>b.checked);
    boxes.forEach(b=> b.checked = !allChecked);
  });
  document.getElementById('genBtn').addEventListener('click', generateAndShowTest);
}

function generateAndShowTest(){
  const n = parseInt(document.getElementById('numEj').value, 10);
  const mix = document.querySelector('input[name="mix"]:checked').value;
  let blocks = selectedBlockIds();
  if(!blocks.length) blocks = BLOCKS.map(b=>b.id);
  CURRENT_TEST = buildTest(n, blocks, mix);
  renderTest();
  document.getElementById('testArea').scrollIntoView({behavior:'smooth', block:'start'});
}

function exerciseHtml(item, idx, part){
  const c = item.c;
  if(item.type === 'f2n'){
    return `
      <div class="exercise" data-part="${part}" data-idx="${idx}">
        <div class="exnum">${idx+1}.</div>
        <div class="exq">
          ${renderFormula(c)}
          <div class="ex-input">
            <input type="text" class="ans-input" placeholder="Escribe el nombre..." autocomplete="off" autocapitalize="off" spellcheck="false">
            <span class="ex-fb"></span>
          </div>
          <div class="reveal"></div>
        </div>
      </div>`;
  }else{
    return `
      <div class="exercise" data-part="${part}" data-idx="${idx}">
        <div class="exnum">${idx+1}.</div>
        <div class="exq">
          <div class="name-prompt">${c.name}</div>
          <div class="ex-input">
            <input type="text" class="ans-input" placeholder="Escribe la fórmula (en tu cuaderno o aquí)..." autocomplete="off" spellcheck="false">
            <button type="button" class="linklike btn-reveal">Ver fórmula correcta</button>
          </div>
          <div class="reveal"></div>
        </div>
      </div>`;
  }
}

function renderTest(){
  const {parte1, parte2} = CURRENT_TEST;
  const code = Math.floor(1000 + Math.random()*9000);
  const dateStr = new Date().toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit', year:'numeric'});

  let html = `
    <div class="testhead">
      <h2 style="margin-bottom:0;">Test de formulación orgánica</h2>
      <span class="testcode">modelo ${code} · ${dateStr}</span>
    </div>
    <p class="print-only" style="margin-top:0;">Nombre y apellidos: _____________________________________________</p>
    <div class="score-banner" id="scoreBanner"></div>
  `;

  if(parte1.length){
    html += `<h3 class="part-title">Parte 1 · Nombra estos compuestos</h3><div class="card">`;
    html += parte1.map((it,i)=> exerciseHtml(it, i, 1)).join('');
    html += `</div>`;
  }
  if(parte2.length){
    html += `<h3 class="part-title">Parte 2 · Formula estos compuestos</h3><div class="card">`;
    html += parte2.map((it,i)=> exerciseHtml(it, i, 2)).join('');
    html += `</div>`;
  }

  document.getElementById('configPanel').classList.add('hidden');
  const area = document.getElementById('testArea');
  area.classList.remove('hidden');
  area.innerHTML = html;

  document.querySelectorAll('.exercise').forEach(exEl=>{
    const part = parseInt(exEl.dataset.part,10);
    const idx = parseInt(exEl.dataset.idx,10);
    const item = part===1 ? CURRENT_TEST.parte1[idx] : CURRENT_TEST.parte2[idx];
    const revealBtn = exEl.querySelector('.btn-reveal');
    if(revealBtn){
      revealBtn.addEventListener('click', ()=>{
        const rev = exEl.querySelector('.reveal');
        rev.innerHTML = `<b>Fórmula correcta:</b> ${renderFormula(item.c)}`;
        rev.classList.add('show');
        revealBtn.disabled = true;
        revealBtn.textContent = 'Fórmula mostrada';
      });
    }
  });

  buildToolbar();
}

function buildToolbar(){
  let bar = document.getElementById('toolbarEl');
  if(bar) bar.remove();
  bar = document.createElement('div');
  bar.id = 'toolbarEl';
  bar.className = 'toolbar no-print';
  const hasPart1 = CURRENT_TEST.parte1.length > 0;
  bar.innerHTML = `<div class="wrap">
    ${hasPart1 ? '<button class="btn" id="correctBtn" type="button">Corregir Parte 1</button>' : ''}
    <button class="btn subtle" id="printBtn" type="button">Imprimir / PDF</button>
    <button class="btn ghost" id="newBtn" type="button">Nuevo test</button>
  </div>`;
  document.body.appendChild(bar);
  if(hasPart1) document.getElementById('correctBtn').addEventListener('click', correctPart1);
  document.getElementById('printBtn').addEventListener('click', ()=> window.print());
  document.getElementById('newBtn').addEventListener('click', ()=>{
    document.getElementById('testArea').classList.add('hidden');
    document.getElementById('configPanel').classList.remove('hidden');
    document.getElementById('toolbarEl').remove();
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

function correctPart1(){
  const exercises = document.querySelectorAll('.exercise[data-part="1"]');
  let correct = 0;
  exercises.forEach(exEl=>{
    const idx = parseInt(exEl.dataset.idx,10);
    const item = CURRENT_TEST.parte1[idx];
    const input = exEl.querySelector('.ans-input');
    const fb = exEl.querySelector('.ex-fb');
    const ok = answerMatches(input.value, item.c);
    fb.textContent = ok ? 'Correcto' : `Solución: ${item.c.name}`;
    fb.className = 'ex-fb ' + (ok?'good':'bad');
    input.disabled = true;
    if(ok) correct++;
  });
  const banner = document.getElementById('scoreBanner');
  if(exercises.length){
    banner.textContent = `Parte 1: ${correct} de ${exercises.length} correctas (${Math.round(100*correct/exercises.length)}%).`;
    banner.classList.add('show');
    if(correct < exercises.length) banner.style.color = 'var(--ink)';
  }
  banner.scrollIntoView({behavior:'smooth', block:'center'});
}

function initTheme(){
  const btn = document.getElementById('themeBtn');
  let saved = null;
  try{ saved = localStorage.getItem('organica_theme'); }catch(e){}
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  btn.addEventListener('click', ()=>{
    const current = document.documentElement.getAttribute('data-theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = current ? current==='dark' : prefersDark;
    const next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('organica_theme', next); }catch(e){}
  });
}

document.addEventListener('DOMContentLoaded', ()=>{
  renderConfig();
  initTheme();
});

</script>
